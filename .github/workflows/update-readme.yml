name: Update latest writing

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://btrindade.com/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) - $date$newline"
          date_format: "yyyy-mm-dd"
          tag_post_pre_newline: true
          commit_message: "docs: update latest blog posts"
